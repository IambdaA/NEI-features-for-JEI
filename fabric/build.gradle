plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
}

version = mod_version
group = mod_group_id

// The shared code and assets come from ../common (compiled into this jar, so it holds everything).
// The few client API calls that differ between Minecraft versions live in common/src/<mc_compat>/java (McCompat).
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.java.srcDir "../common/src/${mc_compat}/java"
sourceSets.main.resources.srcDir '../common/src/main/resources'

repositories {
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
}

base {
    archivesName = "${mod_id}-fabric-${jar_mc_label}"
}

// Mojang ships Java 25 to end users in 26.x, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

loom {
    accessWidenerPath = file('src/main/resources/neiaddon.accesswidener')
}

dependencies {
    // Minecraft 26.x is not obfuscated: no mappings, and mods are plain dependencies (no "mod" configurations)
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // JEI API at compile time, full JEI at runtime (so the dev client has it). JEI is an optional dependency of this mod.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    localRuntime "net.mezzdev.config:mezz_config-${minecraft_version}-fabric:${mezz_config_version}"
}

// Expands the properties in fabric.mod.json (and nothing else: the shared resources are copied as they are).
processResources {
    var replaceProperties = [
            minecraft_version_range_fabric: fabric_minecraft_range,
            fabric_loader_version         : fabric_loader_version,
            jei_version_range_fabric      : fabric_jei_range,
            mod_id                        : mod_id,
            mod_name                      : mod_name,
            mod_license                   : mod_license,
            mod_version                   : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
