// Plugins are loaded here once; each loader module applies the one it needs.
plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
    // Fabric Loom: Minecraft 26.x is not obfuscated, so this is the plain (no remap) plugin id.
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}
