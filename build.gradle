// Plugins are loaded here once; each loader module applies the one it needs.
plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.148' apply false
    // Fabric Loom: 1.20.1 is an obfuscated Minecraft, so the "remap" flavour. If Gradle cannot find this plugin id,
    // try 'fabric-loom' (the older id of the same plugin) in this file and in fabric/build.gradle.
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}
