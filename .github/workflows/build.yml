name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: neoforge-26.1.2
            task: :neoforge:build
            jars: neoforge/build/libs/*.jar
          - name: fabric-26.1.2
            task: :fabric:build
            jars: fabric/build/libs/*.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ${{ matrix.name }}
        run: ./gradlew ${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        with:
          name: neiaddon-${{ matrix.name }}
          path: ${{ matrix.jars }}
