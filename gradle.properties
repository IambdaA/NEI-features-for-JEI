# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache
org.gradle.configuration-cache=false

# Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]

# NeoForge (https://projects.neoforged.net/neoforged/neoforge); must agree with the Minecraft version
neo_version=21.1.264
# the oldest NeoForge the mod accepts (built against neo_version)
neo_version_range=[21.1.235,)

# Fabric: Loom (the Gradle plugin), the loader and Fabric API. These three were NOT checked against the Fabric maven
# from where this was written: if Gradle says one of them does not exist, pick a current one for 1.21.1
# (https://fabricmc.net/develop) and put it here.
loom_version=1.18-SNAPSHOT
fabric_loader_version=0.19.5
fabric_api_version=0.116.17+1.21.1

# JEI: 19.x is the Minecraft 1.21.1 line (same version on NeoForge and Fabric)
jei_version=19.69.0.457
jei_version_range=[19,)
# JEI's Fabric jar needs its config library at run time (it is not pulled in by itself in the dev client)
mezz_config_version=0.6.6

## Mod Properties
mod_id=neiaddon
mod_name=NEI Features for JEI
mod_license=LGPL-3.0-or-later
mod_version=1.1.1
mod_group_id=neiaddon
