# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache
org.gradle.configuration-cache=false

# Minecraft
minecraft_version=26.2
# NeoForge's version range for Minecraft; Fabric's for the same
minecraft_version_range=[26.2]
fabric_minecraft_range=>=26.2 <26.3
# Part of the jar's file name (the 26.1.x branch builds one jar for 26.1, 26.1.1 and 26.1.2)
jar_mc_label=26.2
# Which common/src/<name>/java folder holds the version specific McCompat class: mc26_2 or mc26_1
mc_compat=mc26_2

# NeoForge (https://projects.neoforged.net/neoforged/neoforge); must agree with the Minecraft version
neo_version=26.2.0.90
neo_version_range=[26.2.0.90,)

# Fabric: Loom (the Gradle plugin), the loader and Fabric API (https://fabricmc.net/develop)
loom_version=1.18-SNAPSHOT
fabric_loader_version=0.19.5
fabric_api_version=0.158.0+26.2

# JEI: 30.x is the Minecraft 26.2 line (same version on NeoForge and Fabric)
jei_version=30.42.0.237
jei_version_range=[30,)
fabric_jei_range=>=30
# JEI's Fabric jar needs its config library at run time (it is not pulled in by itself in the dev client)
mezz_config_version=0.6.6

## Mod Properties
mod_id=neiaddon
mod_name=NEI Features for JEI
mod_license=LGPL-3.0-or-later
mod_version=0.1.0
mod_group_id=neiaddon
