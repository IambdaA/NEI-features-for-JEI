# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache
org.gradle.configuration-cache=false

# Minecraft
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)

# Forge (https://files.minecraftforge.net); must agree with the Minecraft version
forge_version=47.4.23
forge_version_range=[47,)

# Fabric: Loom (the Gradle plugin), the loader and Fabric API (the versions JEI itself is built with)
loom_version=1.18-SNAPSHOT
fabric_loader_version=0.19.4
fabric_api_version=0.92.11+1.20.1

# JEI: 15.x is the Minecraft 1.20.1 line (same version on Forge and Fabric)
jei_version=15.+
jei_version_range=[15.38,16)
# JEI's Fabric jar needs its config library at run time (it is not pulled in by itself in the dev client)
mezz_config_version=0.6.6

## Mod Properties
mod_id=neiaddon
mod_name=NEI Features for JEI
mod_license=LGPL-3.0-or-later
mod_version=0.1.0
mod_group_id=neiaddon
